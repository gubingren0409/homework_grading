name: Code Quality Checks

on:
  pull_request:
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "scripts/**/*.py"
      - ".github/workflows/code-quality.yml"
      - "pyproject.toml"
      - "requirements*.txt"
  push:
    branches:
      - main
      - master
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "scripts/**/*.py"
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy bandit safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Black (code formatting check)
        run: |
          black --check --diff src tests scripts
        continue-on-error: false

      - name: Run isort (import sorting check)
        run: |
          isort --check-only --diff src tests scripts
        continue-on-error: false

      - name: Run Flake8 (linting)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src tests scripts --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src tests scripts --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics
        continue-on-error: false

      - name: Run Mypy (type checking)
        run: |
          mypy src --ignore-missing-imports --no-strict-optional --check-untyped-defs
        continue-on-error: true

      - name: Run Bandit (security scanning)
        run: |
          bandit -r src -ll -f json -o bandit-report.json || true
          bandit -r src -ll
        continue-on-error: true

      - name: Check for known security vulnerabilities
        run: |
          safety check --json || true
        continue-on-error: true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30
